<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#0f1923"/>
<meta name="description" content="MRCPCH FOP &amp; TAS Quiz Engine"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MRCPCH Quiz"/>
<title>MRCPCH Quiz Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── DARK THEME (default) ── */
[data-theme="dark"]{
  --bg:#0f1923;
  --surface:#162030;
  --surface2:#1e2d3d;
  --surface3:#243447;
  --border:#2a3f54;
  --border2:#1e3248;
  --accent:#3dd6f5;
  --accent2:#f5a623;
  --accent3:#50e3a4;
  --danger:#ff5c5c;
  --warn:#f5a623;
  --text:#e8edf2;
  --text2:#8fa3b8;
  --text3:#4d6478;
  --correct:#50e3a4;
  --wrong:#ff5c5c;
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --shadow2:0 2px 8px rgba(0,0,0,.3);
  --login-bg:linear-gradient(135deg,#0a1520 0%,#0f1f30 50%,#0a1520 100%);
  --scrollbar-track:#162030;
  --scrollbar-thumb:#2a3f54;
  --option-hover:rgba(61,214,245,.05);
  --badge-fop-bg:rgba(61,214,245,.15);
  --badge-tas-bg:rgba(245,166,35,.15);
  --badge-both-bg:rgba(80,227,164,.15);
  --correct-bg:rgba(80,227,164,.08);
  --wrong-bg:rgba(255,92,92,.08);
  --stat-correct-bg:rgba(80,227,164,.1);
  --stat-wrong-bg:rgba(255,92,92,.1);
  --tutor-user-bg:rgba(61,214,245,.1);
  --tutor-user-border:rgba(61,214,245,.2);
  --admin-badge-bg:rgba(245,166,35,.15);
  --admin-badge-color:#f5a623;
  --guest-badge-bg:rgba(61,214,245,.12);
  --guest-badge-color:#3dd6f5;
  --danger-soft-bg:rgba(255,92,92,.12);
  --danger-soft-border:rgba(255,92,92,.2);
  --info-bg:rgba(61,214,245,.1);
  --info-border:rgba(61,214,245,.2);
  --success-bg:rgba(80,227,164,.1);
  --success-border:rgba(80,227,164,.25);
  --err-bg:rgba(255,92,92,.1);
  --err-border:rgba(255,92,92,.25);
  --warn-bg:rgba(245,166,35,.1);
  --warn-border:rgba(245,166,35,.2);
  --drop-bg:var(--surface2);
  --drop-hover-bg:rgba(61,214,245,.06);
  --drop-active-border:var(--accent);
  --file-chip-bg:rgba(61,214,245,.08);
  --file-chip-border:rgba(61,214,245,.25);
  --topbar-bg:var(--surface);
  --card-bg:var(--surface);
  --input-bg:var(--surface2);
  --modal-bg:var(--surface);
}

/* ── LIGHT THEME ── */
[data-theme="light"]{
  --bg:#f0f4f8;
  --surface:#ffffff;
  --surface2:#f5f7fa;
  --surface3:#eaeff5;
  --border:#d0dae6;
  --border2:#c5d2e0;
  --accent:#0a9ebb;
  --accent2:#d4820a;
  --accent3:#1a9e6e;
  --danger:#d63c3c;
  --warn:#d4820a;
  --text:#1a2636;
  --text2:#4a6480;
  --text3:#8aa0b8;
  --correct:#1a9e6e;
  --wrong:#d63c3c;
  --shadow:0 4px 24px rgba(0,0,0,.12);
  --shadow2:0 2px 8px rgba(0,0,0,.08);
  --login-bg:linear-gradient(135deg,#e2ecf7 0%,#f0f5fb 50%,#e2ecf7 100%);
  --scrollbar-track:#f0f4f8;
  --scrollbar-thumb:#c5d2e0;
  --option-hover:rgba(10,158,187,.05);
  --badge-fop-bg:rgba(10,158,187,.12);
  --badge-tas-bg:rgba(212,130,10,.12);
  --badge-both-bg:rgba(26,158,110,.12);
  --correct-bg:rgba(26,158,110,.08);
  --wrong-bg:rgba(214,60,60,.08);
  --stat-correct-bg:rgba(26,158,110,.1);
  --stat-wrong-bg:rgba(214,60,60,.1);
  --tutor-user-bg:rgba(10,158,187,.08);
  --tutor-user-border:rgba(10,158,187,.2);
  --admin-badge-bg:rgba(212,130,10,.12);
  --admin-badge-color:#b36d08;
  --guest-badge-bg:rgba(10,158,187,.1);
  --guest-badge-color:#0a7a96;
  --danger-soft-bg:rgba(214,60,60,.08);
  --danger-soft-border:rgba(214,60,60,.2);
  --info-bg:rgba(10,158,187,.08);
  --info-border:rgba(10,158,187,.2);
  --success-bg:rgba(26,158,110,.08);
  --success-border:rgba(26,158,110,.25);
  --err-bg:rgba(214,60,60,.08);
  --err-border:rgba(214,60,60,.2);
  --warn-bg:rgba(212,130,10,.08);
  --warn-border:rgba(212,130,10,.2);
  --drop-bg:var(--surface2);
  --drop-hover-bg:rgba(10,158,187,.04);
  --drop-active-border:var(--accent);
  --file-chip-bg:rgba(10,158,187,.06);
  --file-chip-border:rgba(10,158,187,.2);
  --topbar-bg:var(--surface);
  --card-bg:var(--surface);
  --input-bg:var(--surface2);
  --modal-bg:var(--surface);
}

:root{
  --r4:4px;--r8:8px;--r12:12px;--r16:16px;--r24:24px;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
#root{height:100%}
button{cursor:pointer;border:none;font-family:var(--sans);font-size:14px;font-weight:500;transition:all .15s ease}
input,textarea,select{font-family:var(--sans);font-size:14px;color:var(--text)}
a{color:var(--accent)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--scrollbar-track)}
::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;padding:0 20px;height:56px;background:var(--topbar-bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;gap:10px;box-shadow:var(--shadow2)}
.topbar-logo{font-family:var(--serif);font-size:18px;color:var(--accent);flex:1;letter-spacing:.5px;white-space:nowrap}
.topbar-logo span{color:var(--text2);font-size:13px;font-family:var(--sans);font-weight:400;margin-left:8px}
.topbar-btn{background:none;color:var(--text2);padding:6px 10px;border-radius:var(--r8);font-size:13px;display:flex;align-items:center;gap:6px;border:none}
.topbar-btn:hover{background:var(--surface2);color:var(--text)}
.topbar-sep{width:1px;height:24px;background:var(--border);margin:0 2px;flex-shrink:0}
.main{flex:1;padding:20px;max-width:960px;margin:0 auto;width:100%}

/* ── THEME TOGGLE ── */
.theme-toggle{width:40px;height:22px;border-radius:11px;background:var(--surface3);border:1.5px solid var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.theme-toggle-knob{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:var(--accent);transition:left .2s;display:flex;align-items:center;justify-content:center;font-size:9px}
[data-theme="dark"] .theme-toggle-knob{left:2px}
[data-theme="light"] .theme-toggle-knob{left:18px}

/* ── LOGIN ── */
.login-screen{min-height:100vh;background:var(--login-bg);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r24);padding:40px 36px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo h1{font-family:var(--serif);font-size:32px;color:var(--accent);letter-spacing:.5px}
.login-logo p{font-size:13px;color:var(--text2);margin-top:4px}
.login-tabs{display:flex;background:var(--surface2);border-radius:var(--r12);padding:4px;gap:4px;margin-bottom:24px;border:1px solid var(--border)}
.login-tab{flex:1;padding:8px;border-radius:var(--r8);font-size:13px;font-weight:600;background:none;border:none;color:var(--text3);cursor:pointer;transition:all .15s;text-align:center}
.login-tab.active{background:var(--accent);color:#fff}

/* ── CARDS ── */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r16);padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}
.card-title{font-family:var(--serif);font-size:20px;color:var(--text)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.3px}
.badge-fop{background:var(--badge-fop-bg);color:var(--accent)}
.badge-tas{background:var(--badge-tas-bg);color:var(--accent2)}
.badge-both{background:var(--badge-both-bg);color:var(--accent3)}
.badge-count{background:var(--surface2);color:var(--text2);font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--border)}
.badge-admin{background:var(--admin-badge-bg);color:var(--admin-badge-color);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-guest{background:var(--guest-badge-bg);color:var(--guest-badge-color);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--r8);font-weight:600;font-size:14px;transition:all .15s;white-space:nowrap;border:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface3);border-color:var(--border2)}
.btn-danger{background:var(--danger-soft-bg);color:var(--danger);border:1px solid var(--danger-soft-border)}
.btn-danger:hover{filter:brightness(1.1)}
.btn-success{background:var(--accent3);color:#fff}
.btn-success:hover{filter:brightness(1.1)}
.btn-warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-xs{padding:4px 9px;font-size:12px}
.btn-icon{padding:7px;border-radius:var(--r8);background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.btn-icon:hover{color:var(--text);background:var(--surface3)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;filter:none!important}

/* ── FORMS ── */
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px;letter-spacing:.5px;text-transform:uppercase}
.input{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:var(--r8);color:var(--text);padding:10px 14px;outline:none;transition:border-color .15s;-webkit-appearance:none}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--text3)}
.textarea{resize:vertical;min-height:120px;font-size:13px;line-height:1.5}
select.input{cursor:pointer}

/* ── ALERTS ── */
.alert{padding:12px 16px;border-radius:var(--r8);font-size:14px;display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.alert-error{background:var(--err-bg);border:1px solid var(--err-border);color:var(--danger)}
.alert-success{background:var(--success-bg);border:1px solid var(--success-border);color:var(--correct)}
.alert-info{background:var(--info-bg);border:1px solid var(--info-border);color:var(--accent)}
.alert-warn{background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn)}

/* ── BANK LIST ── */
.bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.bank-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r16);padding:18px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,box-shadow .15s}
.bank-card:hover{border-color:var(--border2);box-shadow:var(--shadow2)}
.bank-card-name{font-family:var(--serif);font-size:18px;color:var(--text);line-height:1.2}
.bank-card-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bank-card-date{font-size:12px;color:var(--text3)}
.bank-card-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}

/* ── QUIZ ── */
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.quiz-progress-ring{position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.quiz-progress-ring svg{transform:rotate(-90deg)}
.quiz-progress-ring .ring-text{position:absolute;text-align:center}
.quiz-progress-ring .ring-text .ring-num{font-family:var(--serif);font-size:18px;color:var(--text);display:block;line-height:1}
.quiz-progress-ring .ring-text .ring-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.quiz-stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat-pill{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r24);font-size:13px;font-weight:600}
.stat-correct{background:var(--stat-correct-bg);color:var(--correct)}
.stat-wrong{background:var(--stat-wrong-bg);color:var(--wrong)}
.stat-skip{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.question-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r16);padding:24px;margin-bottom:16px;box-shadow:var(--shadow2)}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.q-num{font-size:13px;color:var(--text3);font-weight:700}
.q-source{font-size:12px;color:var(--text3);margin-left:auto}
.q-text{font-size:16px;color:var(--text);line-height:1.75;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:var(--r12);border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;transition:all .15s;text-align:left;width:100%}
.option:hover:not(.revealed){border-color:var(--accent);background:var(--option-hover)}
.option.selected{border-color:var(--accent);background:var(--option-hover)}
.option.correct{border-color:var(--correct);background:var(--correct-bg)}
.option.wrong{border-color:var(--wrong);background:var(--wrong-bg)}
.option.correct-reveal{border-color:var(--correct);background:var(--correct-bg)}
.option-letter{width:28px;height:28px;border-radius:6px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text2);flex-shrink:0;transition:all .15s}
.option.selected .option-letter{background:var(--accent);color:#fff}
.option.correct .option-letter{background:var(--correct);color:#fff}
.option.wrong .option-letter{background:var(--wrong);color:#fff}
.option.correct-reveal .option-letter{background:var(--correct);color:#fff}
.option-text{font-size:14px;color:var(--text);line-height:1.5;flex:1;margin-top:2px}
.explanation-panel{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r12);padding:16px;margin-top:14px}
.explanation-panel h4{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.explanation-text{font-size:14px;color:var(--text);line-height:1.75;white-space:pre-wrap}

/* ── QUIZ NAV ── */
.quiz-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.q-jump{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;max-height:100px;overflow-y:auto;padding:8px;background:var(--surface2);border-radius:var(--r12);border:1px solid var(--border)}
.q-dot{width:30px;height:30px;border-radius:var(--r8);border:1.5px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center}
.q-dot:hover{border-color:var(--accent);color:var(--accent)}
.q-dot.current{border-color:var(--accent);background:var(--accent);color:#fff}
.q-dot.answered-correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct)}
.q-dot.answered-wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
.q-dot.answered-skip{background:var(--surface3);border-color:var(--border2);color:var(--text2)}

/* ── RESULTS ── */
.results-hero{text-align:center;padding:36px 20px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r16);margin-bottom:20px;box-shadow:var(--shadow2)}
.results-score{font-family:var(--serif);font-size:80px;line-height:1}
.results-grade{font-family:var(--serif);font-size:26px;margin:10px 0}
.results-label{font-size:14px;color:var(--text2)}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.results-stat{background:var(--surface2);border-radius:var(--r12);padding:16px;text-align:center;border:1px solid var(--border)}
.results-stat-num{font-family:var(--serif);font-size:30px;margin-bottom:4px}
.results-stat-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}

/* ── REVIEW ── */
.review-filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:7px 16px;border-radius:var(--r24);font-size:13px;font-weight:600;background:var(--surface2);color:var(--text2);border:1.5px solid var(--border);cursor:pointer;transition:all .15s}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.review-item{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r12);padding:16px;margin-bottom:12px}
.review-item.correct{border-left:4px solid var(--correct)}
.review-item.wrong{border-left:4px solid var(--wrong)}
.review-item.skip{border-left:4px solid var(--text3)}
.review-q{font-size:14px;color:var(--text);margin-bottom:10px;line-height:1.65}
.review-ans{font-size:13px;margin-bottom:4px}
.review-ans.your{color:var(--text2)}
.review-ans.correct-ans{color:var(--correct);font-weight:600}
.review-exp{font-size:13px;color:var(--text2);margin-top:10px;line-height:1.65;white-space:pre-wrap;padding:12px;background:var(--surface2);border-radius:var(--r8);border:1px solid var(--border)}

/* ── AI TUTOR ── */
.tutor-panel{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r16);overflow:hidden;margin-top:16px}
.tutor-header{padding:12px 18px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.tutor-msgs{padding:16px;max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.tutor-msg{padding:12px 14px;border-radius:var(--r12);font-size:14px;line-height:1.65;max-width:90%;white-space:pre-wrap}
.tutor-msg.user{background:var(--tutor-user-bg);border:1px solid var(--tutor-user-border);color:var(--text);align-self:flex-end}
.tutor-msg.ai{background:var(--surface2);border:1px solid var(--border);color:var(--text);align-self:flex-start}
.tutor-msg.thinking{color:var(--text3);font-style:italic}
.tutor-input{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--border)}
.tutor-input .input{flex:1}
.tutor-suggest{padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--surface2)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease;backdrop-filter:blur(3px)}
.modal{background:var(--modal-bg);border:1px solid var(--border);border-radius:var(--r16);padding:28px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .2s ease;box-shadow:var(--shadow)}
.modal-wide{max-width:700px}
.modal-title{font-family:var(--serif);font-size:22px;margin-bottom:20px;color:var(--text)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

/* ── SEARCH ── */
.search-box{position:relative}
.search-box .input{padding-left:40px}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}

/* ── EMPTY ── */
.empty{text-align:center;padding:56px 20px;color:var(--text3)}
.empty-icon{font-size:52px;margin-bottom:16px}
.empty-title{font-family:var(--serif);font-size:22px;color:var(--text2);margin-bottom:8px}
.empty-sub{font-size:14px;line-height:1.65;max-width:360px;margin:0 auto}

/* ── CONFIG ── */
.config-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.config-opt{padding:12px;border-radius:var(--r8);border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;text-align:center;transition:all .15s}
.config-opt:hover{border-color:var(--accent)}
.config-opt.active{border-color:var(--accent);background:var(--option-hover)}
.config-opt-label{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px}
.config-opt-sub{font-size:11px;color:var(--text3)}

/* ── PROGRESS BAR ── */
.progress-bar{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease}

/* ── FILE UPLOAD ── */
.dropzone{border:2px dashed var(--border);border-radius:var(--r12);padding:32px 20px;text-align:center;cursor:pointer;transition:all .2s;background:var(--drop-bg);position:relative}
.dropzone:hover,.dropzone.drag-over{border-color:var(--accent);background:var(--drop-hover-bg)}
.dropzone-icon{font-size:36px;margin-bottom:10px}
.dropzone-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px}
.dropzone-sub{font-size:13px;color:var(--text3)}
.file-chip{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r8);background:var(--file-chip-bg);border:1px solid var(--file-chip-border);margin-top:12px}
.file-chip-name{font-size:14px;font-weight:600;color:var(--accent);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-chip-size{font-size:12px;color:var(--text3);white-space:nowrap}
.err-scroll{max-height:180px;overflow-y:auto}

/* ── ADMIN PANEL ── */
.section-title{font-family:var(--serif);font-size:20px;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.user-list{display:flex;flex-direction:column;gap:10px}
.user-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r12);flex-wrap:wrap}
.user-avatar{width:38px;height:38px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--accent);flex-shrink:0;border:2px solid var(--border)}
.user-info{flex:1;min-width:0}
.user-name{font-weight:700;font-size:14px;color:var(--text)}
.user-meta{font-size:12px;color:var(--text3);margin-top:2px}
.user-actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.admin-tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--surface2);padding:4px;border-radius:var(--r12);border:1px solid var(--border)}
.admin-tab{flex:1;padding:8px 10px;border-radius:var(--r8);font-size:13px;font-weight:600;color:var(--text3);background:none;border:none;cursor:pointer;transition:all .15s;text-align:center}
.admin-tab.active{background:var(--accent);color:#fff}

/* ── MISC ── */
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:var(--surface3);color:var(--text2);border:1px solid var(--border)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(128,128,128,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
.divider{height:1px;background:var(--border);margin:20px 0}
.text-muted{color:var(--text2);font-size:13px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

  .user-row{flex-direction:column;align-items:flex-start}
}

/* ── Built-in admin (never stored, always present) ── */
const ADMIN={username:'kathir',password:'mrcpch',role:'admin',displayName:'Kathiravan',createdAt:'built-in'};

function hashSimple(s){
  // Simple non-crypto hash for client-side password storage
  let h=0;for(let i=0;i<s.length;i++){h=(Math.imul(31,h)+s.charCodeAt(i))|0;}
  return h.toString(36);
}

function loadUsers(){
  try{const d=localStorage.getItem(LS_USERS);return d?JSON.parse(d):[];}catch{return[];}
}
function saveUsers(u){localStorage.setItem(LS_USERS,JSON.stringify(u));}
function loadBanks(){
  try{const d=localStorage.getItem(LS_BANKS);return d?JSON.parse(d):{};}catch{return{};}
}
function saveBanks(b){localStorage.setItem(LS_BANKS,JSON.stringify(b));}

function loadModel(){return localStorage.getItem(LS_MODEL)||'';}
function saveModel(m){localStorage.setItem(LS_MODEL,m);}
function loadSession(){

}
function saveSession(s){localStorage.setItem(LS_SESSION,JSON.stringify(s));}
function clearSession(){localStorage.removeItem(LS_SESSION);}
function loadTheme(){return localStorage.getItem(LS_THEME)||'dark';}
function saveTheme(t){localStorage.setItem(LS_THEME,t);document.documentElement.setAttribute('data-theme',t);}

function authenticate(username,password){
  const u=username.trim().toLowerCase();
  const p=password.trim();
  if(u===ADMIN.username&&p===ADMIN.password)return{...ADMIN,password:undefined};
  const users=loadUsers();
  const found=users.find(x=>x.username===u&&x.passwordHash===hashSimple(p)&&x.active!==false);
  if(found)return{...found,passwordHash:undefined};
  return null;
}

/* ══════════════════════════════════════════════════
   VALIDATION
══════════════════════════════════════════════════ */
function validateBank(obj){
  const errs=[];
  if(!obj||typeof obj!=='object'){return['Not a valid JSON object'];}
  if(!obj.name||typeof obj.name!=='string'||!obj.name.trim())errs.push('Missing or invalid "name" field');
  if(!Array.isArray(obj.questions)||obj.questions.length===0)errs.push('Missing or empty "questions" array');
  if(errs.length)return errs;
  const ids=new Set();
  obj.questions.forEach((q,i)=>{
    const p=`Q[${i+1}]`;
    if(q.id===undefined||q.id===null)errs.push(`${p}: missing "id"`);
    else if(ids.has(String(q.id)))errs.push(`${p}: duplicate id "${q.id}"`);
    else ids.add(String(q.id));
    if(!q.q||typeof q.q!=='string')errs.push(`${p}: missing "q" (question text)`);
    if(!Array.isArray(q.opts)||q.opts.length<2)errs.push(`${p}: "opts" must be array with ≥2 items`);
    if(q.answer===undefined||q.answer===null)errs.push(`${p}: missing "answer"`);
    else if(typeof q.answer!=='number'||q.answer<0||(q.opts&&q.answer>=q.opts.length))errs.push(`${p}: "answer" index out of range (got ${q.answer}, need 0–${(q.opts||[]).length-1})`);
  });
  return errs;
}

/* ══════════════════════════════════════════════════
   GEMINI
══════════════════════════════════════════════════ */
async function detectModel(apiKey){
  const stored=loadModel();if(stored)return stored;
  try{
    const r=await fetch(`${GEMINI_BASE}/models?key=${apiKey}`);
    const d=await r.json();
    const preferred=['gemini-2.5-flash','gemini-1.5-flash','gemini-1.0-pro','gemini-pro'];
    const names=(d.models||[]).map(m=>m.name.replace('models/',''));
    for(const p of preferred){if(names.includes(p)){saveModel(p);return p;}}
    if(names.length){saveModel(names[0]);return names[0];}
  }catch{}
  return'gemini-1.5-flash';
}
async function askGemini(apiKey,model,msgs){
  const contents=msgs.map(m=>({role:m.role==='ai'?'model':'user',parts:[{text:m.content}]}));
  const r=await fetch(`${GEMINI_BASE}/models/${model}:generateContent?key=${apiKey}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents,generationConfig:{maxOutputTokens:8192}})
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'No response';
}

const LoginScreen=({onLogin,theme,onToggleTheme})=>{
  const [tab,setTab]=useState('admin');
  const [username,setUsername]=useState('');
  const [password,setPassword]=useState('');
  const [showPass,setShowPass]=useState(false);
  const [err,setErr]=useState('');
  const [loading,setLoading]=useState(false);

  const submit=()=>{
    setErr('');
    if(!username.trim()||!password.trim()){setErr('Enter username and password.');return;}
    setLoading(true);
    setTimeout(()=>{
      const user=authenticate(username,password);
      setLoading(false);
      if(!user){setErr('Invalid username or password.');return;}
      if(tab==='admin'&&user.role!=='admin'){setErr('This account is not an admin.');return;}
      if(tab==='guest'&&user.role==='admin'){setErr('Use the Admin tab to sign in as admin.');return;}
      saveSession(user);
      onLogin(user);
    },300);
  };

    h('div',{style:{position:'fixed',top:14,right:16,zIndex:50}},h(ThemeToggle,{theme,onToggle:onToggleTheme})),

/* ══════════════════════════════════════════════════
   IMPORT MODAL (admin only)
══════════════════════════════════════════════════ */
const ImportModal=({onClose,onImport})=>{
  const [errs,setErrs]=useState([]);
  const [preview,setPreview]=useState(null);
  const [fileName,setFileName]=useState('');
  const [fileSize,setFileSize]=useState('');
  const [dragOver,setDragOver]=useState(false);
  const [loading,setLoading]=useState(false);
  const fileRef=useRef();

  const examBreakdown=(qs)=>{
    const fop=qs.filter(q=>q.exam==='FOP').length;
    const tas=qs.filter(q=>q.exam==='TAS').length;
    return{fop,tas,other:qs.length-fop-tas};
  };

  const processText=(text,name,size)=>{
    setErrs([]);setPreview(null);setFileName(name);setFileSize(size);
    const clean=text.replace(/^\uFEFF/,'').trim();
    let obj;
    try{obj=JSON.parse(clean);}
    catch(e){
      setErrs([
        `❌ Invalid JSON — ${e.message}`,
        'Common causes: trailing commas after last item, missing quotes on keys, unescaped special characters in strings.'
      ]);return;
    }
    const e=validateBank(obj);
    if(e.length){setErrs(e);return;}
    setPreview(obj);
  };

  const readFile=(file)=>{
    if(!file)return;
    if(!file.name.match(/\.json$/i)){setErrs(['❌ Wrong file type — please select a .json file.']);setPreview(null);setFileName('');return;}
    if(file.size>10*1024*1024){setErrs(['❌ File too large (max 10 MB).']);setPreview(null);setFileName('');return;}
    setLoading(true);
    const kb=(file.size/1024).toFixed(1);
    const reader=new FileReader();
    reader.onload=e=>{setLoading(false);processText(e.target.result,file.name,`${kb} KB`);};
    reader.onerror=()=>{setLoading(false);setErrs(['❌ Could not read file — try again.']);};
    reader.readAsText(file,'utf-8');
  };
  const onFileInput=e=>{readFile(e.target.files?.[0]);e.target.value='';};
  const onDrop=e=>{e.preventDefault();setDragOver(false);readFile(e.dataTransfer.files?.[0]);};

  return h('div',{className:'modal-overlay',onClick:e=>{if(e.target===e.currentTarget)onClose();}},
    h('div',{className:'modal'},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}},
        h('h2',{className:'modal-title',style:{margin:0}},'📥 Import Question Bank'),
        h('button',{className:'btn-icon',onClick:onClose},h(Icon,{name:'close',size:18}))
      ),
      h('div',{
        className:`dropzone${dragOver?' drag-over':''}`,
        onDrop,
        onDragOver:e=>{e.preventDefault();setDragOver(true);},
        onDragLeave:()=>setDragOver(false),
        onClick:()=>fileRef.current&&fileRef.current.click()
      },
        h('input',{ref:fileRef,type:'file',accept:'.json,application/json',onChange:onFileInput,style:{display:'none'}}),
        loading
          ?h('div',null,h('span',{className:'spinner'}),h('p',{style:{marginTop:10,color:'var(--text2)',fontSize:14}},'Reading file…'))
          :h('div',null,
            h('div',{className:'dropzone-icon'},'📂'),
            h('div',{className:'dropzone-title'},fileName?'Replace file':'Click to choose a file'),
            h('div',{className:'dropzone-sub'},'or drag & drop a .json file here')
          ),
        fileName&&!loading&&h('div',{className:'file-chip',onClick:e=>e.stopPropagation()},
          h(Icon,{name:'info',size:16,color:'var(--accent)'}),
          h('span',{className:'file-chip-name'},fileName),
          h('span',{className:'file-chip-size'},fileSize)
        )
      ),
      errs.length>0&&h('div',{className:'alert alert-error',style:{marginTop:14}},
        h('div',{style:{width:'100%'}},
          h('strong',null,`${errs.length} error${errs.length>1?'s':''} found`),
          h('div',{className:'err-scroll',style:{marginTop:6}},
            h('ul',{style:{paddingLeft:18,margin:0}},errs.map((e,i)=>h('li',{key:i,style:{fontSize:13,marginBottom:4,lineHeight:1.5}},e)))
          )
        )
      ),
      preview&&h('div',{className:'alert alert-success',style:{marginTop:14}},
        h('div',{style:{width:'100%'}},
          h('strong',null,'✓ Valid — ready to import'),
          h('div',{style:{fontSize:15,marginTop:4,marginBottom:6}},h('strong',null,preview.name),' — ',preview.questions.length,' questions'),
          h('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},
            (()=>{const{fop,tas,other}=examBreakdown(preview.questions);return[
              fop>0&&h('span',{key:'f',className:'badge badge-fop'},`FOP: ${fop}`),
              tas>0&&h('span',{key:'t',className:'badge badge-tas'},`TAS: ${tas}`),
              other>0&&h('span',{key:'o',className:'badge badge-count'},`Other: ${other}`)
            ];})()
          )
        )
      ),
      !preview&&errs.length===0&&h('div',{className:'alert alert-info',style:{marginTop:14,fontSize:13}},
        h(Icon,{name:'info',size:15}),
        h('span',null,' Expected: ',h('code',{style:{background:'var(--surface3)',padding:'1px 6px',borderRadius:3,fontSize:12}},
          '{"name":"...","questions":[...]}'
        ))
      ),
      h('div',{className:'modal-actions'},
        h('button',{className:'btn btn-secondary',onClick:onClose},'Cancel'),
        h('button',{className:'btn btn-primary',onClick:()=>{if(preview){onImport(preview);onClose();}},disabled:!preview},
          h(Icon,{name:'import',size:15}),' Import Bank'
        )
      )
    )
  );
};

const CreateUserModal=({onClose,onCreated})=>{
  const [username,setUsername]=useState('');
  const [password,setPassword]=useState('');
  const [displayName,setDisplayName]=useState('');
  const [showPass,setShowPass]=useState(false);
  const [err,setErr]=useState('');

  const create=()=>{
    setErr('');
    const u=username.trim().toLowerCase();
    const p=password.trim();
    const d=displayName.trim()||u;
    if(!u){setErr('Username is required.');return;}
    if(u.length<3){setErr('Username must be at least 3 characters.');return;}
    if(!/^[a-z0-9_]+$/.test(u)){setErr('Username: only letters, numbers, underscores.');return;}
    if(!p||p.length<4){setErr('Password must be at least 4 characters.');return;}
    if(u===ADMIN.username){setErr('That username is reserved.');return;}
    const users=loadUsers();
    if(users.find(x=>x.username===u)){setErr(`Username "${u}" already exists.`);return;}
    const newUser={username:u,passwordHash:hashSimple(p),role:'guest',displayName:d,createdAt:new Date().toISOString(),active:true};
    const updated=[...users,newUser];
    saveUsers(updated);
    onCreated(newUser);
    onClose();
  };

  return h('div',{className:'modal-overlay',onClick:e=>{if(e.target===e.currentTarget)onClose();}},
    h('div',{className:'modal'},
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}},

        h('button',{className:'btn-icon',onClick:onClose},h(Icon,{name:'close',size:18}))
      ),
      err&&h('div',{className:'alert alert-error'},h(Icon,{name:'info',size:15}),err),
      h('div',{className:'field'},
        h('label',null,'Display Name (optional)'),
        h('input',{type:'text',className:'input',value:displayName,placeholder:'e.g. Dr. Smith',onChange:e=>setDisplayName(e.target.value)})
      ),
      h('div',{className:'field'},
        h('label',null,'Username'),
        h('input',{type:'text',className:'input',value:username,placeholder:'e.g. drsmith',onChange:e=>setUsername(e.target.value.toLowerCase()),autoCapitalize:'none'})
      ),
      h('div',{className:'field'},
        h('label',null,'Password'),
        h('div',{style:{position:'relative'}},
          h('input',{type:showPass?'text':'password',className:'input',style:{paddingRight:44},value:password,placeholder:'Min. 4 characters',onChange:e=>setPassword(e.target.value)}),

    u.username.includes(search.toLowerCase())||
    (u.displayName||'').toLowerCase().includes(search.toLowerCase())

  const toggleActive=(username)=>{
    const updated=loadUsers().map(u=>u.username===username?{...u,active:!u.active}:u);

const SessionConfig=({bank,bankName,onStart,onBack})=>{

  const filtered=useMemo(()=>{

    else if(examFilter==='tas')q=q.filter(x=>x.exam==='TAS');

/* ══════════════════════════════════════════════════
   AI TUTOR
══════════════════════════════════════════════════ */
const TutorPanel=({context,onOpenSettings})=>{
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const scrollRef=useRef();
  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight;},[msgs]);

  const send=async(txt)=>{
    const t=(txt||input).trim();if(!t)return;
    const apiKey=loadApiKey();
    if(!apiKey){onOpenSettings();return;}
    const userMsg={role:'user',content:t};
    setMsgs(m=>[...m,userMsg]);setInput('');setLoading(true);
    try{
      const model=loadModel()||await detectModel(apiKey);
      const sys={role:'user',content:`You are an expert MRCPCH paediatrics tutor. Context:\n${context}\n\nAnswer concisely and educationally.`};
      const reply=await askGemini(apiKey,model,[sys,...msgs,userMsg]);
      setMsgs(m=>[...m,{role:'ai',content:reply}]);
    }catch(e){setMsgs(m=>[...m,{role:'ai',content:`Error: ${e.message}. Check AI Tutor settings.`}]);}
    setLoading(false);
  };

  const suggests=['Why is the correct answer right?','Key exam points for this topic','Mnemonic for this topic','Common pitfalls here'];

  return h('div',{className:'tutor-panel'},
    h('div',{className:'tutor-header'},h(Icon,{name:'bot',size:17,color:'var(--accent)'}),h('span',null,'AI Tutor')),
    msgs.length===0&&h('div',{className:'tutor-suggest'},
      suggests.map(s=>h('button',{key:s,className:'btn btn-secondary btn-xs',onClick:()=>send(s)},s))
    ),
    h('div',{className:'tutor-msgs',ref:scrollRef},
      msgs.map((m,i)=>h('div',{key:i,className:`tutor-msg ${m.role}`},m.content)),
      loading&&h('div',{className:'tutor-msg ai thinking'},h('span',{className:'spinner'}),' Thinking…')
    ),
    h('div',{className:'tutor-input'},
      h('input',{type:'text',className:'input',value:input,placeholder:'Ask about this question…',onChange:e=>setInput(e.target.value),onKeyDown:e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}),
      h('button',{className:'btn btn-primary btn-sm',onClick:()=>send(),disabled:loading},h(Icon,{name:'send',size:15}))
    )
  );
};

/* ══════════════════════════════════════════════════
   QUIZ SCREEN
══════════════════════════════════════════════════ */
const QuizScreen=({questions,onFinish,onBack})=>{
  const [current,setCurrent]=useState(0);
  const [answers,setAnswers]=useState({});
  const [revealed,setRevealed]=useState({});
  const [showTutor,setShowTutor]=useState(false);
  const [showNav,setShowNav]=useState(false);
  const [showExit,setShowExit]=useState(false);
  const [flagged,setFlagged]=useState(new Set());
  const [showSettings,setShowSettings]=useState(false);

  const q=questions[current];
  const isRevealed=!!revealed[current];
  const correct=Object.keys(answers).filter(i=>answers[i]===questions[i].answer).length;
  const wrong=Object.keys(answers).filter(i=>answers[i]!==undefined&&answers[i]!==-1&&answers[i]!==questions[i].answer).length;
  const skipped=Object.keys(answers).filter(i=>answers[i]===-1).length;

  const select=idx=>{
    if(isRevealed)return;
    setAnswers(a=>({...a,[current]:idx}));
    setRevealed(r=>({...r,[current]:true}));
  };
  const skip=()=>{
    if(isRevealed)return;
    setAnswers(a=>({...a,[current]:-1}));
    setRevealed(r=>({...r,[current]:true}));
  };
  const dotClass=i=>{
    if(i===current)return 'q-dot current';
    if(answers[i]===undefined)return 'q-dot';
    if(answers[i]===-1)return 'q-dot answered-skip';
    return answers[i]===questions[i].answer?'q-dot answered-correct':'q-dot answered-wrong';
  };
  const tutorCtx=`Question: ${q.q}\nOptions:\n${(q.opts||[]).map((o,i)=>`${LETTERS[i]}. ${o}`).join('\n')}\nCorrect: ${LETTERS[q.answer]}. ${(q.opts||[])[q.answer]}\nExplanation: ${q.explanation||''}`;

  return h('div',null,
    showSettings&&h(SettingsModal,{onClose:()=>setShowSettings(false)}),
    showExit&&h('div',{className:'modal-overlay',onClick:e=>{if(e.target===e.currentTarget)setShowExit(false);}},
      h('div',{className:'modal'},
        h('h2',{className:'modal-title'},'Exit Quiz?'),
        h('p',{style:{color:'var(--text2)',marginBottom:20}},'Choose what to do with your progress.'),
        h('div',{className:'modal-actions'},
          h('button',{className:'btn btn-secondary',onClick:()=>setShowExit(false)},'Continue Quiz'),
          h('button',{className:'btn btn-danger',onClick:onBack},'Exit (no results)'),
          h('button',{className:'btn btn-primary',onClick:()=>onFinish(answers,questions)},'Finish & See Results')
        )
      )
    ),
    h('div',{className:'quiz-header'},
      h('div',{style:{display:'flex',alignItems:'center',gap:10}},
        h('button',{className:'btn-icon',onClick:()=>setShowExit(true)},h(Icon,{name:'close',size:18})),
        h('div',{style:{position:'relative',display:'inline-flex',alignItems:'center',justifyContent:'center'}},
          h('div',{className:'quiz-progress-ring'},
            h('svg',{width:68,height:68,viewBox:'0 0 64 64'},
              h('circle',{cx:32,cy:32,r:28,fill:'none',stroke:'var(--surface3)',strokeWidth:4}),
              h('circle',{cx:32,cy:32,r:28,fill:'none',stroke:'var(--accent)',strokeWidth:4,
                strokeDasharray:`${(current+1)/questions.length*2*Math.PI*28} ${2*Math.PI*28}`,
                strokeLinecap:'round',style:{transition:'stroke-dasharray .4s ease'}})
            ),
            h('div',{className:'ring-text'},
              h('span',{className:'ring-num'},current+1),
              h('span',{className:'ring-label'},`/ ${questions.length}`)
            )
          )
        )
      ),
      h('div',{className:'quiz-stats'},
        h('div',{className:'stat-pill stat-correct'},h(Icon,{name:'check',size:13}),' ',correct),
        h('div',{className:'stat-pill stat-wrong'},h(Icon,{name:'close',size:13}),' ',wrong),
        h('div',{className:'stat-pill stat-skip'},'⏭ ',skipped),
        h('button',{className:'btn-icon',title:'AI Tutor Settings',onClick:()=>setShowSettings(true)},h(Icon,{name:'settings',size:16}))
      )
    ),
    h('div',{className:'progress-bar'},h('div',{className:'progress-fill',style:{width:`${(current+1)/questions.length*100}%`}})),
    h('div',{className:'question-card'},
      h('div',{className:'q-meta'},
        h('span',{className:'q-num'},`Q${current+1}`),
        q.exam&&h('span',{className:`badge badge-${(q.exam||'').toUpperCase()==='FOP'?'fop':'tas'}`},q.exam),
        q.topic&&h('span',{className:'tag'},q.topic),
        flagged.has(current)&&h('span',{style:{color:'var(--warn)',fontSize:13,display:'flex',alignItems:'center',gap:3}},h(Icon,{name:'flag',size:13,color:'var(--warn)'}),' Flagged'),
        h('span',{className:'q-source'},q.source||'')
      ),
      h('p',{className:'q-text'},q.q),
      h('div',{className:'options'},
        (q.opts||[]).map((opt,i)=>{
          let cls='option';
          if(isRevealed){
            if(i===q.answer)cls+=' correct';
            else if(answers[current]===i)cls+=' wrong';
          } else if(answers[current]===i)cls+=' selected';
          return h('button',{key:i,className:cls,onClick:()=>select(i),disabled:isRevealed&&i!==q.answer&&answers[current]!==i},
            h('span',{className:'option-letter'},LETTERS[i]),
            h('span',{className:'option-text'},opt)
          );
        })
      ),
      isRevealed&&q.explanation&&h('div',{className:'explanation-panel'},
        h('h4',null,'Explanation'),
        h('div',{className:'explanation-text'},q.explanation)
      )
    ),
    h('div',{className:'quiz-nav'},
      !isRevealed&&h('button',{className:'btn btn-secondary',onClick:skip},'⏭ Skip'),
      h('button',{className:`btn ${flagged.has(current)?'btn-warn':'btn-secondary'}`,onClick:()=>setFlagged(f=>{const n=new Set(f);n.has(current)?n.delete(current):n.add(current);return n;})},
        h(Icon,{name:'flag',size:14,color:flagged.has(current)?'var(--warn)':'currentColor'}),flagged.has(current)?' Unflag':' Flag'
      ),
      h('div',{style:{flex:1}}),
      current>0&&h('button',{className:'btn btn-secondary',onClick:()=>setCurrent(c=>c-1)},h(Icon,{name:'prev',size:15}),' Prev'),
      current<questions.length-1
        ?h('button',{className:'btn btn-primary',onClick:()=>setCurrent(c=>c+1)},'Next ',h(Icon,{name:'next',size:15}))
        :h('button',{className:'btn btn-success',onClick:()=>onFinish(answers,questions)},h(Icon,{name:'award',size:15}),' Finish'),
      h('button',{className:'btn btn-secondary',onClick:()=>setShowTutor(t=>!t)},h(Icon,{name:'bot',size:15}),showTutor?' Hide AI':' AI Tutor'),
      h('button',{className:'btn btn-secondary btn-sm',onClick:()=>setShowNav(n=>!n)},'Nav')
    ),
    showNav&&h('div',{className:'q-jump'},questions.map((_,i)=>h('button',{key:i,className:dotClass(i),onClick:()=>{setCurrent(i);setShowNav(false);}},i+1))),
    showTutor&&isRevealed&&h(TutorPanel,{context:tutorCtx,onOpenSettings:()=>setShowSettings(true)}),
    showTutor&&!isRevealed&&h('div',{className:'alert alert-info',style:{marginTop:8}},h(Icon,{name:'info',size:15}),' Answer the question first to use AI Tutor.')
  );
};

/* ══════════════════════════════════════════════════
   RESULTS

const ResultsScreen=({questions,answers,bankName,onReview,onRetry,onHome})=>{
  const total=questions.length;
  const correct=questions.filter((_,i)=>answers[i]===questions[i].answer).length;
  const wrong=questions.filter((_,i)=>answers[i]!==undefined&&answers[i]!==-1&&answers[i]!==questions[i].answer).length;
  const skipped=questions.filter((_,i)=>answers[i]===-1||answers[i]===undefined).length;
  const pct=total>0?Math.round(correct/total*100):0;
  const grade=pct>=75?'PASS':pct>=65?'BORDERLINE':'FAIL';
  const gradeColor=pct>=75?'var(--correct)':pct>=65?'var(--warn)':'var(--wrong)';

  return h('div',null,
    h('div',{className:'results-hero'},
      h('div',{style:{fontSize:12,color:'var(--text3)',marginBottom:8,textTransform:'uppercase',letterSpacing:'.5px'}},bankName),
      h('div',{className:'results-score',style:{color:gradeColor}},`${pct}%`),
      h('div',{className:'results-grade',style:{color:gradeColor}},grade),
      h('div',{className:'results-label'},`${correct} correct out of ${total} questions`),
      h('div',{className:'results-grid'},
        h('div',{className:'results-stat'},h('div',{className:'results-stat-num',style:{color:'var(--correct)'}},correct),h('div',{className:'results-stat-label'},'Correct')),
        h('div',{className:'results-stat'},h('div',{className:'results-stat-num',style:{color:'var(--wrong)'}},wrong),h('div',{className:'results-stat-label'},'Wrong')),
        h('div',{className:'results-stat'},h('div',{className:'results-stat-num',style:{color:'var(--text2)'}},skipped),h('div',{className:'results-stat-label'},'Skipped'))
      )
    ),
    h('div',{className:'btn-group',style:{justifyContent:'center',flexWrap:'wrap'}},
      h('button',{className:'btn btn-primary',onClick:()=>onReview('all')},h(Icon,{name:'search',size:15}),' Review All'),
      h('button',{className:'btn btn-secondary',onClick:()=>onReview('wrong')},h(Icon,{name:'close',size:14}),' Wrong Only'),
      h('button',{className:'btn btn-secondary',onClick:()=>onReview('correct')},h(Icon,{name:'check',size:14}),' Correct Only'),
      h('button',{className:'btn btn-secondary',onClick:()=>onReview('skip')},'⏭ Skipped'),
      h('button',{className:'btn btn-secondary',onClick:onRetry},'🔁 Retry'),
      h('button',{className:'btn btn-secondary',onClick:onHome},h(Icon,{name:'home',size:14}),' Home')
    )
  );
};

/* ══════════════════════════════════════════════════
   REVIEW
══════════════════════════════════════════════════ */
const ReviewScreen=({questions,answers,initialFilter,onBack})=>{
  const [filter,setFilter]=useState(initialFilter||'all');
  const [expanded,setExpanded]=useState({});
  const [showSettings,setShowSettings]=useState(false);

  const filtered=useMemo(()=>questions.map((q,i)=>({q,i,ans:answers[i]})).filter(({q,i,ans})=>{
    if(filter==='all')return true;
    if(filter==='correct')return ans===q.answer;
    if(filter==='wrong')return ans!==undefined&&ans!==-1&&ans!==q.answer;
    if(filter==='skip')return ans===-1||ans===undefined;
    return true;
  }),[questions,answers,filter]);

  const counts={
    all:questions.length,
    correct:questions.filter((q,i)=>answers[i]===q.answer).length,
    wrong:questions.filter((q,i)=>answers[i]!==undefined&&answers[i]!==-1&&answers[i]!==q.answer).length,
    skip:questions.filter((q,i)=>answers[i]===-1||answers[i]===undefined).length
  };

  return h('div',null,
    showSettings&&h(SettingsModal,{onClose:()=>setShowSettings(false)}),
    h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:16}},
      h('button',{className:'btn-icon',onClick:onBack},h(Icon,{name:'prev',size:18})),
      h('h2',{style:{fontFamily:'var(--serif)',fontSize:22,flex:1,color:'var(--text)'}},'Review'),
      h('button',{className:'btn-icon',onClick:()=>setShowSettings(true)},h(Icon,{name:'bot',size:16}))
    ),
    h('div',{className:'review-filters'},
      [['all','All',counts.all],['correct','✓ Correct',counts.correct],['wrong','✗ Wrong',counts.wrong],['skip','⏭ Skipped',counts.skip]].map(([v,l,c])=>
        h('button',{key:v,className:`filter-btn ${filter===v?'active':''}`,onClick:()=>setFilter(v)},`${l} (${c})`)
      )
    ),
    filtered.length===0
      ?h('div',{className:'empty'},h('div',{className:'empty-icon'},'🎉'),h('div',{className:'empty-title'},'Nothing in this filter!'))
      :filtered.map(({q,i,ans})=>{
        const isCorrect=ans===q.answer;
        const isSkip=ans===-1||ans===undefined;
        const cls=`review-item ${isSkip?'skip':isCorrect?'correct':'wrong'}`;
        const isOpen=!!expanded[i];
        const tutorCtx=`Question: ${q.q}\nOptions:\n${(q.opts||[]).map((o,j)=>`${LETTERS[j]}. ${o}`).join('\n')}\nCorrect: ${LETTERS[q.answer]}. ${(q.opts||[])[q.answer]}\nExplanation: ${q.explanation||''}`;
        return h('div',{key:i,className:cls},
          h('div',{className:'q-meta',style:{marginBottom:8}},
            h('span',{className:'q-num'},`Q${i+1}`),
            q.exam&&h('span',{className:`badge badge-${(q.exam||'').toUpperCase()==='FOP'?'fop':'tas'}`},q.exam),
            q.topic&&h('span',{className:'tag'},q.topic)
          ),
          h('div',{className:'review-q'},q.q),
          h('div',{className:'review-ans your'},`Your answer: ${ans===undefined||ans===-1?'Skipped':`${LETTERS[ans]}. ${(q.opts||[])[ans]}`}`),
          h('div',{className:'review-ans correct-ans'},`Correct: ${LETTERS[q.answer]}. ${(q.opts||[])[q.answer]}`),
          q.explanation&&h('div',null,
            h('button',{style:{background:'none',border:'none',color:'var(--accent)',fontSize:13,cursor:'pointer',padding:'6px 0',fontFamily:'var(--sans)'},
              onClick:()=>setExpanded(e=>({...e,[i]:!e[i]}))},
              isOpen?'▼ Hide explanation':'▶ Show explanation'
            ),
            isOpen&&h(Fragment,null,
              h('div',{className:'review-exp'},q.explanation),
              h(TutorPanel,{context:tutorCtx,onOpenSettings:()=>setShowSettings(true)})
            )
          )
        );
      })
  );
};

/* ══════════════════════════════════════════════════

══════════════════════════════════════════════════ */
const App=()=>{
  const [theme,setTheme]=useState(()=>{const t=loadTheme();document.documentElement.setAttribute('data-theme',t);return t;});
  const [user,setUser]=useState(loadSession);
  const [banks,setBanks]=useState(loadBanks);
  const [users,setUsers]=useState(loadUsers);
  const [screen,setScreen]=useState('home');
  const [activeBank,setActiveBank]=useState(null);
  const [quizQuestions,setQuizQuestions]=useState([]);
  const [quizAnswers,setQuizAnswers]=useState({});
  const [reviewFilter,setReviewFilter]=useState('all');

  const [showImport,setShowImport]=useState(false);
  const [adminTab,setAdminTab]=useState('banks');

  const isAdmin=user&&user.role==='admin';

  const toggleTheme=()=>{const t=theme==='dark'?'light':'dark';setTheme(t);saveTheme(t);};

  const handleLogin=u=>{setUser(u);setScreen('home');};
  const handleLogout=()=>{clearSession();setUser(null);setScreen('home');};

  const refreshUsers=()=>setUsers(loadUsers());

  const handleImport=bank=>{
    const updated={...banks,[bank.name]:{...bank,imported:new Date().toISOString()}};
    setBanks(updated);saveBanks(updated);
  };
  const handleDelete=name=>{
    const updated={...banks};delete updated[name];setBanks(updated);saveBanks(updated);
  };
  const handleExport=name=>{
    const bank=banks[name];if(!bank)return;
    const blob=new Blob([JSON.stringify(bank,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`${name.replace(/\s+/g,'_')}_qbank.json`;a.click();URL.revokeObjectURL(a.href);
  };

  const handleStartConfig=name=>{setActiveBank(name);setScreen('config');};
  const handleStartQuiz=qs=>{setQuizQuestions(qs);setQuizAnswers({});setScreen('quiz');};
  const handleFinish=(ans,qs)=>{setQuizAnswers(ans);setScreen('results');};
  const handleReview=f=>{setReviewFilter(f);setScreen('review');};

  if(!user)return h(LoginScreen,{onLogin:handleLogin,theme,onToggleTheme:toggleTheme});

  const topbarRight=()=>h(Fragment,null,
    h(ThemeToggle,{theme,onToggle:toggleTheme}),
    h('div',{className:'topbar-sep'}),
    isAdmin&&h('button',{className:'topbar-btn',onClick:()=>setShowImport(true)},h(Icon,{name:'import',size:14}),' Import'),
    h('button',{className:'topbar-btn',onClick:()=>setShowSettings(true)},h(Icon,{name:'bot',size:14}),' AI'),
    h('div',{className:'topbar-sep'}),
    h('span',{style:{fontSize:13,color:'var(--text2)',display:'flex',alignItems:'center',gap:6}},
      h('span',{className:isAdmin?'badge-admin badge':'badge-guest badge'},isAdmin?'Admin':'Guest'),
      h('span',{style:{color:'var(--text)',fontWeight:600,maxWidth:100,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},user.displayName||user.username)
    ),
    h('button',{className:'topbar-btn',onClick:handleLogout,title:'Sign out'},h(Icon,{name:'logout',size:15}))
  );

  return h('div',{className:'app'},
    showSettings&&h(SettingsModal,{onClose:()=>setShowSettings(false)}),
    showImport&&isAdmin&&h(ImportModal,{onClose:()=>setShowImport(false),onImport:handleImport}),
    h('div',{className:'topbar'},
      h('div',{className:'topbar-logo'},
        'MRCPCH',h('span',null,'Quiz Engine')
      ),
      screen!=='home'&&screen!=='admin'&&h('button',{className:'topbar-btn',onClick:()=>setScreen('home')},h(Icon,{name:'home',size:14}),' Home'),
      isAdmin&&h('button',{className:`topbar-btn ${screen==='admin'?'':''}`,style:screen==='admin'?{color:'var(--accent)'}:{},onClick:()=>setScreen(s=>s==='admin'?'home':'admin')},h(Icon,{name:'users',size:14}),' Admin'),
      h('div',{style:{flex:1}}),
      topbarRight()
    ),
    h('div',{className:'main'},
      screen==='home'&&h(HomeScreen,{banks,user,onStart:handleStartConfig,onDelete:handleDelete,onExport:handleExport,onImport:handleImport}),
      screen==='config'&&activeBank&&h(SessionConfig,{bank:banks[activeBank],bankName:activeBank,onStart:handleStartQuiz,onBack:()=>setScreen('home')}),
      screen==='quiz'&&h(QuizScreen,{questions:quizQuestions,onFinish:handleFinish,onBack:()=>setScreen('home')}),
      screen==='results'&&h(ResultsScreen,{questions:quizQuestions,answers:quizAnswers,bankName:activeBank||'',onReview:handleReview,onRetry:()=>{setQuizAnswers({});setScreen('quiz');},onHome:()=>setScreen('home')}),
      screen==='review'&&h(ReviewScreen,{questions:quizQuestions,answers:quizAnswers,initialFilter:reviewFilter,onBack:()=>setScreen('results')}),
      screen==='admin'&&isAdmin&&h('div',null,
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20,flexWrap:'wrap',gap:10}},
          h('h2',{className:'section-title'},h(Icon,{name:'users',size:22}),' Admin Panel')
        ),
        h('div',{className:'admin-tabs'},
          h('button',{className:`admin-tab ${adminTab==='banks'?'active':''}`,onClick:()=>setAdminTab('banks')},h(Icon,{name:'home',size:13}),' Question Banks'),
          h('button',{className:`admin-tab ${adminTab==='users'?'active':''}`,onClick:()=>setAdminTab('users')},h(Icon,{name:'users',size:13}),` Guest Accounts (${users.length})`)
        ),
        adminTab==='banks'&&h(HomeScreen,{banks,user,onStart:handleStartConfig,onDelete:handleDelete,onExport:handleExport,onImport:handleImport}),
        adminTab==='users'&&h(UserManagement,{users,onUsersChanged:refreshUsers})
      )
    )
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(h(App));

/* ── Service Worker ── */
if('serviceWorker' in navigator){
  const sw=`const C='mrcpch-v3';const U=['./', './index.html'];
self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(U).catch(()=>{})));self.skipWaiting();});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))));self.clients.claim();});
self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('./index.html'))));});`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
