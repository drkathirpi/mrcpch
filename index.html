<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1923;
  --surface:#162030;
  --surface2:#1e2d3d;
  --surface3:#243447;
  --border:#2a3f54;
  --accent:#3dd6f5;
  --accent2:#f5a623;
  --accent3:#50e3a4;
  --danger:#ff5c5c;
  --warn:#f5a623;
  --text:#e8edf2;
  --text2:#8fa3b8;
  --text3:#4d6478;
  --correct:#50e3a4;
  --wrong:#ff5c5c;
  --r4:4px;--r8:8px;--r12:12px;--r16:16px;--r24:24px;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --shadow:0 4px 24px rgba(0,0,0,.35);
  --shadow2:0 2px 8px rgba(0,0,0,.25);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
#root{height:100%}
button{cursor:pointer;border:none;font-family:var(--sans);font-size:14px;font-weight:500;transition:all .15s ease}
input,textarea,select{font-family:var(--sans);font-size:14px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* Layout */
.app{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;padding:0 20px;height:56px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;gap:12px}
.topbar-logo{font-family:var(--serif);font-size:18px;color:var(--accent);flex:1;letter-spacing:.5px}
.topbar-logo span{color:var(--text2);font-size:13px;font-family:var(--sans);font-weight:400;margin-left:8px}
.topbar-btn{background:none;color:var(--text2);padding:6px 10px;border-radius:var(--r8);font-size:13px;display:flex;align-items:center;gap:6px}
.topbar-btn:hover{background:var(--surface2);color:var(--text)}
.main{flex:1;padding:20px;max-width:960px;margin:0 auto;width:100%}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r16);padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}
.card-title{font-family:var(--serif);font-size:20px;color:var(--text)}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.3px}
.badge-fop{background:rgba(61,214,245,.15);color:var(--accent)}
.badge-tas{background:rgba(245,166,35,.15);color:var(--accent2)}
.badge-both{background:rgba(80,227,164,.15);color:var(--accent3)}
.badge-count{background:var(--surface2);color:var(--text2);font-size:12px;padding:3px 10px;border-radius:20px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--r8);font-weight:600;font-size:14px;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#0f1923}
.btn-primary:hover{background:#5ae0f7;transform:translateY(-1px)}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--surface3);border-color:var(--text3)}
.btn-danger{background:rgba(255,92,92,.12);color:var(--danger);border:1px solid rgba(255,92,92,.2)}
.btn-danger:hover{background:rgba(255,92,92,.2)}
.btn-success{background:var(--accent3);color:#0f1923}
.btn-success:hover{background:#6aebb8}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-icon{padding:7px;border-radius:var(--r8);background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.btn-icon:hover{color:var(--text);background:var(--surface3)}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* Forms */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;letter-spacing:.3px;text-transform:uppercase}
.input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r8);color:var(--text);padding:10px 14px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--text3)}
.textarea{resize:vertical;min-height:160px;font-size:13px;line-height:1.5}

/* Alert / Toast */
.alert{padding:12px 16px;border-radius:var(--r8);font-size:14px;display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.alert-error{background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.25);color:#ffaaaa}
.alert-success{background:rgba(80,227,164,.1);border:1px solid rgba(80,227,164,.25);color:var(--accent3)}
.alert-info{background:rgba(61,214,245,.1);border:1px solid rgba(61,214,245,.2);color:var(--accent)}
.alert-warn{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.2);color:var(--accent2)}

/* Bank List */
.bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.bank-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r16);padding:18px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.bank-card:hover{border-color:var(--text3)}
.bank-card-name{font-family:var(--serif);font-size:18px;color:var(--text);line-height:1.2}
.bank-card-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bank-card-date{font-size:12px;color:var(--text3)}
.bank-card-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}

/* Quiz */
.quiz-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.quiz-progress-ring{position:relative;display:flex;align-items:center;justify-content:center}
.quiz-progress-ring svg{transform:rotate(-90deg)}
.quiz-progress-ring .ring-text{position:absolute;text-align:center}
.quiz-progress-ring .ring-text .ring-num{font-family:var(--serif);font-size:18px;color:var(--text);display:block;line-height:1}
.quiz-progress-ring .ring-text .ring-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}
.quiz-stats{display:flex;gap:16px;align-items:center}
.stat-pill{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r24);font-size:13px;font-weight:600}
.stat-correct{background:rgba(80,227,164,.1);color:var(--correct)}
.stat-wrong{background:rgba(255,92,92,.1);color:var(--wrong)}
.stat-skip{background:var(--surface2);color:var(--text2)}

.question-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r16);padding:24px;margin-bottom:16px}
.q-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.q-num{font-size:13px;color:var(--text3);font-weight:600}
.q-source{font-size:12px;color:var(--text3);margin-left:auto}
.q-text{font-size:16px;color:var(--text);line-height:1.7;margin-bottom:20px}

.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-radius:var(--r12);border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;transition:all .15s;text-align:left;width:100%}
.option:hover:not(.selected):not(.revealed){border-color:var(--accent);background:rgba(61,214,245,.05)}
.option.selected{border-color:var(--accent);background:rgba(61,214,245,.08)}
.option.correct{border-color:var(--correct);background:rgba(80,227,164,.08)}
.option.wrong{border-color:var(--wrong);background:rgba(255,92,92,.08)}
.option.correct-reveal{border-color:var(--correct);background:rgba(80,227,164,.06)}
.option-letter{width:28px;height:28px;border-radius:6px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--text2);flex-shrink:0;transition:all .15s}
.option.selected .option-letter{background:var(--accent);color:#0f1923}
.option.correct .option-letter{background:var(--correct);color:#0f1923}
.option.wrong .option-letter{background:var(--wrong);color:#fff}
.option.correct-reveal .option-letter{background:rgba(80,227,164,.3);color:var(--correct)}
.option-text{font-size:14px;color:var(--text);line-height:1.5;flex:1;margin-top:2px}

.explanation-panel{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r12);padding:16px;margin-top:14px}
.explanation-panel h4{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px}
.explanation-text{font-size:14px;color:var(--text);line-height:1.7;white-space:pre-wrap}

.quiz-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q-jump{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;max-height:80px;overflow-y:auto}
.q-dot{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);font-size:12px;font-weight:600;color:var(--text3);cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center}
.q-dot:hover{border-color:var(--accent);color:var(--accent)}
.q-dot.current{border-color:var(--accent);background:rgba(61,214,245,.15);color:var(--accent)}
.q-dot.answered-correct{background:rgba(80,227,164,.2);border-color:rgba(80,227,164,.4);color:var(--correct)}
.q-dot.answered-wrong{background:rgba(255,92,92,.2);border-color:rgba(255,92,92,.4);color:var(--wrong)}
.q-dot.answered-skip{background:var(--surface3);border-color:var(--text3);color:var(--text2)}

/* Results */
.results-hero{text-align:center;padding:32px 20px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r16);margin-bottom:20px}
.results-score{font-family:var(--serif);font-size:72px;color:var(--accent);line-height:1}
.results-grade{font-family:var(--serif);font-size:24px;color:var(--text);margin:8px 0}
.results-label{font-size:14px;color:var(--text2)}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.results-stat{background:var(--surface2);border-radius:var(--r12);padding:16px;text-align:center}
.results-stat-num{font-family:var(--serif);font-size:28px;margin-bottom:4px}
.results-stat-label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}

/* Review */
.review-filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:7px 16px;border-radius:var(--r24);font-size:13px;font-weight:600;background:var(--surface2);color:var(--text2);border:1px solid var(--border);cursor:pointer;transition:all .15s}
.filter-btn.active{background:var(--accent);color:#0f1923;border-color:var(--accent)}
.review-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r12);padding:16px;margin-bottom:12px}
.review-item.correct{border-left:3px solid var(--correct)}
.review-item.wrong{border-left:3px solid var(--wrong)}
.review-item.skip{border-left:3px solid var(--text3)}
.review-q{font-size:14px;color:var(--text);margin-bottom:10px;line-height:1.6}
.review-ans{font-size:13px;margin-bottom:4px}
.review-ans.your{color:var(--text2)}
.review-ans.correct-ans{color:var(--correct)}
.review-exp{font-size:13px;color:var(--text2);margin-top:8px;line-height:1.6;white-space:pre-wrap}

/* AI Tutor */
.tutor-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r16);overflow:hidden;margin-top:16px}
.tutor-header{padding:14px 18px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.tutor-msgs{padding:16px;max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.tutor-msg{padding:12px 14px;border-radius:var(--r12);font-size:14px;line-height:1.6;max-width:90%}
.tutor-msg.user{background:rgba(61,214,245,.1);border:1px solid rgba(61,214,245,.2);color:var(--text);align-self:flex-end}
.tutor-msg.ai{background:var(--surface2);border:1px solid var(--border);color:var(--text);align-self:flex-start}
.tutor-msg.thinking{color:var(--text3);font-style:italic}
.tutor-input{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border)}
.tutor-input .input{flex:1}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r16);padding:24px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp .2s ease}
.modal-title{font-family:var(--serif);font-size:22px;margin-bottom:20px;color:var(--text)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}

/* Search */
.search-box{position:relative;margin-bottom:20px}
.search-box .input{padding-left:40px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3)}

/* Empty State */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-title{font-family:var(--serif);font-size:22px;color:var(--text2);margin-bottom:8px}
.empty-sub{font-size:14px;line-height:1.6}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--surface2);padding:4px;border-radius:var(--r12);border:1px solid var(--border)}
.tab{flex:1;padding:8px 12px;border-radius:var(--r8);font-size:13px;font-weight:600;color:var(--text3);background:none;border:none;cursor:pointer;transition:all .15s;text-align:center}
.tab.active{background:var(--accent);color:#0f1923}
.tab:hover:not(.active){color:var(--text);background:var(--surface3)}

/* Misc */
.divider{height:1px;background:var(--border);margin:20px 0}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:var(--surface3);color:var(--text2)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(61,214,245,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
.settings-modal input.input{padding:10px 14px}

/* Session Config */
.config-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.config-opt{padding:12px;border-radius:var(--r8);border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;text-align:center;transition:all .15s}
.config-opt:hover{border-color:var(--accent)}
.config-opt.active{border-color:var(--accent);background:rgba(61,214,245,.08)}
.config-opt-label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.config-opt-sub{font-size:11px;color:var(--text3)}

/* Progress bar */
.progress-bar{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

@media(max-width:600px){
  .main{padding:12px}
  .bank-grid{grid-template-columns:1fr}
  .results-grid{grid-template-columns:repeat(2,1fr)}
  .quiz-header{flex-direction:column;align-items:flex-start}
  .q-text{font-size:15px}
  .option{padding:12px 14px}
}
</style>
</head>

// ─── Validation ───────────────────────────────────────────────────────────────
function validateBank(obj){
  const errs=[];
  if(!obj||typeof obj!=='object')return['Not a valid JSON object'];
  if(!obj.name||typeof obj.name!=='string')errs.push('Missing or invalid "name" field');
  if(!Array.isArray(obj.questions)||obj.questions.length===0)errs.push('Missing or empty "questions" array');
  if(errs.length)return errs;
  const ids=new Set();
  obj.questions.forEach((q,i)=>{
    const p=`Q[${i+1}]`;
    if(q.id===undefined||q.id===null)errs.push(`${p}: missing "id"`);
    else if(ids.has(q.id))errs.push(`${p}: duplicate id "${q.id}"`);
    else ids.add(q.id);
    if(!q.q||typeof q.q!=='string')errs.push(`${p}: missing "q" (question text)`);
    if(!Array.isArray(q.opts)||q.opts.length<2)errs.push(`${p}: "opts" must be array with ≥2 items`);
    if(q.answer===undefined||q.answer===null)errs.push(`${p}: missing "answer"`);
    else if(typeof q.answer!=='number'||q.answer<0||(q.opts&&q.answer>=q.opts.length))errs.push(`${p}: "answer" index out of range`);
  });
  return errs;
}

// ─── Gemini ───────────────────────────────────────────────────────────────────
async function detectModel(apiKey){
  const stored=loadModel();
  if(stored)return stored;
  try{
    const r=await fetch(`${GEMINI_BASE}/models?key=${apiKey}`);
    const d=await r.json();
    const preferred=['gemini-2.5-flash','gemini-1.5-flash','gemini-1.0-pro','gemini-pro'];
    const names=(d.models||[]).map(m=>m.name.replace('models/',''));
    for(const p of preferred){if(names.includes(p)){saveModel(p);return p;}}
    if(names.length){saveModel(names[0]);return names[0];}
  }catch{}
  return'gemini-1.5-flash';
}

async function askGemini(apiKey,model,msgs){
  const contents=msgs.map(m=>({role:m.role==='ai'?'model':'user',parts:[{text:m.content}]}));
  const r=await fetch(`${GEMINI_BASE}/models/${model}:generateContent?key=${apiKey}`,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents,generationConfig:{maxOutputTokens:8192}})
  });
  const d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.candidates?.[0]?.content?.parts?.[0]?.text||'No response';
}

// ─── Import Modal ─────────────────────────────────────────────────────────────
const ImportModal=({onClose,onImport})=>{
  const [raw,setRaw]=useState('');
  const [errs,setErrs]=useState([]);
  const [preview,setPreview]=useState(null);

  const parse=()=>{
    setErrs([]);setPreview(null);
    let obj;
    try{obj=JSON.parse(raw);}
    catch(e){setErrs([`Invalid JSON: ${e.message}`]);return;}
    const e=validateBank(obj);
    if(e.length){setErrs(e);return;}
    setPreview(obj);
  };

  const doImport=()=>{
    if(!preview)return;
    onImport(preview);
    onClose();
  };

  const examBreakdown=(qs)=>{
    const fop=qs.filter(q=>q.exam==='FOP').length;
    const tas=qs.filter(q=>q.exam==='TAS').length;
    const other=qs.length-fop-tas;
    return{fop,tas,other};
  };

  return h('div',{className:'modal-overlay',onClick:e=>{if(e.target.classList.contains('modal-overlay'))onClose()}},
    h('div',{className:'modal'},
      h('h2',{className:'modal-title'},'📥 Import Question Bank'),
      errs.length>0&&h('div',{className:'alert alert-error'},
        h('div',null,
          h('strong',null,'Validation errors:'),
          h('ul',{style:{marginTop:6,paddingLeft:18}},errs.map((e,i)=>h('li',{key:i,style:{fontSize:13,marginBottom:3}},e)))
        )
      ),
      preview&&h('div',{className:'alert alert-success'},
        h('div',null,
          h('strong',null,`✓ "${preview.name}" — ${preview.questions.length} questions`),
          h('div',{style:{marginTop:4,fontSize:13,display:'flex',gap:10,flexWrap:'wrap'}},
            (()=>{const{fop,tas,other}=examBreakdown(preview.questions);return[
              fop>0&&h('span',{key:'fop',className:'badge badge-fop'},`FOP: ${fop}`),
              tas>0&&h('span',{key:'tas',className:'badge badge-tas'},`TAS: ${tas}`),
              other>0&&h('span',{key:'oth',className:'badge badge-count'},`Other: ${other}`)
            ];})()
          )
        )
      ),
      h('div',{className:'field'},
        h('label',null,'Paste Question Bank JSON'),
        h('textarea',{className:'input textarea',value:raw,placeholder:'{\n  "name": "Cardiology",\n  "questions": [\n    {\n      "id": 1,\n      "topic": "CHD",\n      "exam": "FOP",\n      "q": "Question text...",\n      "opts": ["Option A","Option B","Option C","Option D"],\n      "answer": 0,\n      "source": "FOP Recalls 2026",\n      "explanation": "Full explanation..."\n    }\n  ]\n}',onChange:e=>setRaw(e.target.value)})
      ),
      h('div',{className:'modal-actions'},
        h('button',{className:'btn btn-secondary',onClick:onClose},'Cancel'),
        h('button',{className:'btn btn-secondary',onClick:parse},'Validate JSON'),
        h('button',{className:'btn btn-primary',onClick:doImport,disabled:!preview},h(Icon,{name:'import',size:15}),' Import Bank')
      )
    )
  );
};

// ─── AI Tutor Panel ───────────────────────────────────────────────────────────

  const [msgs,setMsgs]=useState([]);

    const txt=input.trim();if(!txt)return;
    const apiKey=loadApiKey();
    if(!apiKey){onOpenSettings();return;}
    const userMsg={role:'user',content:txt};
    setMsgs(m=>[...m,userMsg]);
    setInput('');setLoading(true);
    try{
      const model=loadModel()||await detectModel(apiKey);
      const sys={role:'user',content:`You are an expert MRCPCH paediatrics tutor. Context:\n${context}\n\nAnswer concisely and educationally.`};
      const history=[sys,...msgs,userMsg];
      const reply=await askGemini(apiKey,model,history);
      setMsgs(m=>[...m,{role:'ai',content:reply}]);
    }catch(e){setMsgs(m=>[...m,{role:'ai',content:`Error: ${e.message}. Check Settings.`}]);}
    setLoading(false);
  };

  const suggest=[
    'Explain why the correct answer is right',
    'What are the key exam points?',
    'Give a mnemonic for this topic',
    'What are common pitfalls?'

  return h('div',{className:'tutor-panel'},

      h('span',{style:{fontSize:12,color:'var(--text3)',marginLeft:'auto'}},loadApiKey()?loadModel()||'auto-detect':'No API key — click ⚙️')
    ),
    msgs.length===0&&h('div',{style:{padding:'12px 16px',display:'flex',gap:8,flexWrap:'wrap',borderBottom:'1px solid var(--border)'}},
      suggest.map(s=>h('button',{key:s,className:'btn btn-secondary btn-sm',style:{fontSize:12},onClick:()=>{setInput(s);}},s))
    ),
    h('div',{className:'tutor-msgs',ref:scrollRef},
      msgs.map((m,i)=>h('div',{key:i,className:`tutor-msg ${m.role}`},m.content)),
      loading&&h('div',{className:'tutor-msg ai thinking'},h('span',{className:'spinner'}),' Thinking…')
    ),
    h('div',{className:'tutor-input'},
      h('input',{type:'text',className:'input',value:input,placeholder:'Ask about this question…',onChange:e=>setInput(e.target.value),onKeyDown:e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}}),
      h('button',{className:'btn btn-primary btn-sm',onClick:send,disabled:loading},h(Icon,{name:'send',size:15}))
    )
  );
};

// ─── Quiz Screen ──────────────────────────────────────────────────────────────
const QuizScreen=({questions,onFinish,onBack})=>{
  const [current,setCurrent]=useState(0);
  const [answers,setAnswers]=useState({});
  const [revealed,setRevealed]=useState({});
  const [showTutor,setShowTutor]=useState(false);
  const [showNav,setShowNav]=useState(false);
  const [showExitConfirm,setShowExitConfirm]=useState(false);
  const [flagged,setFlagged]=useState(new Set());
  const [openSettings,setOpenSettings]=useState(false);

  const q=questions[current];
  const answered=answers[current]!==undefined;
  const isRevealed=revealed[current];
  const correct=Object.keys(answers).filter(i=>answers[i]===questions[i].answer).length;
  const wrong=Object.keys(answers).filter(i=>answers[i]!==questions[i].answer&&answers[i]!==-1).length;
  const skipped=Object.keys(answers).filter(i=>answers[i]===-1).length;

  const select=(idx)=>{
    if(isRevealed||answers[current]===idx)return;
    setAnswers(a=>({...a,[current]:idx}));
    setRevealed(r=>({...r,[current]:true}));
  };
  const skip=()=>{
    if(isRevealed)return;
    setAnswers(a=>({...a,[current]:-1}));
    setRevealed(r=>({...r,[current]:true}));
  };

  const dotClass=(i)=>{
    if(i===current)return 'q-dot current';
    if(answers[i]===undefined)return 'q-dot';
    if(answers[i]===-1)return 'q-dot answered-skip';
    return answers[i]===questions[i].answer?'q-dot answered-correct':'q-dot answered-wrong';
  };

  const tutorContext=`Question: ${q.q}\nOptions: ${(q.opts||[]).map((o,i)=>`${LETTERS[i]}. ${o}`).join('\n')}\nCorrect answer: ${LETTERS[q.answer]}. ${(q.opts||[])[q.answer]}\nExplanation: ${q.explanation||''}`;

  const finish=()=>onFinish(answers,questions);

  return h('div',null,
    openSettings&&h(SettingsModal,{onClose:()=>setOpenSettings(false)}),
    showExitConfirm&&h('div',{className:'modal-overlay',onClick:e=>{if(e.target.classList.contains('modal-overlay'))setShowExitConfirm(false)}},
      h('div',{className:'modal'},
        h('h2',{className:'modal-title'},'Exit Quiz?'),
        h('p',{style:{color:'var(--text2)',marginBottom:20}},'Your progress will be saved as a partial result.'),
        h('div',{className:'modal-actions'},
          h('button',{className:'btn btn-secondary',onClick:()=>setShowExitConfirm(false)},'Continue Quiz'),
          h('button',{className:'btn btn-danger',onClick:()=>onBack()},'Exit Without Saving'),
          h('button',{className:'btn btn-primary',onClick:finish},'Finish & See Results')
        )
      )
    ),
    // Header
    h('div',{className:'quiz-header'},
      h('div',{style:{display:'flex',alignItems:'center',gap:10}},
        h('button',{className:'btn-icon',onClick:()=>setShowExitConfirm(true)},h(Icon,{name:'close',size:18})),
        h(ProgressRing,{current:current+1,total:questions.length})
      ),
      h('div',{className:'quiz-stats'},
        h('div',{className:'stat-pill stat-correct'},h(Icon,{name:'check',size:14}),' ',correct),
        h('div',{className:'stat-pill stat-wrong'},h(Icon,{name:'close',size:14}),' ',wrong),
        h('div',{className:'stat-pill stat-skip'},'⏭ ',skipped),
        h('button',{className:'btn-icon',onClick:()=>setOpenSettings(true)},h(Icon,{name:'settings',size:16}))
      )
    ),
    // Progress bar
    h('div',{className:'progress-bar'},h('div',{className:'progress-fill',style:{width:`${((current+1)/questions.length)*100}%`}})),
    // Question
    h('div',{className:'question-card'},
      h('div',{className:'q-meta'},
        h('span',{className:'q-num'},`Q${current+1} of ${questions.length}`),
        q.exam&&h('span',{className:`badge badge-${(q.exam||'').toLowerCase()==='fop'?'fop':'tas'}`},q.exam),
        q.topic&&h('span',{className:'tag'},q.topic),
        flagged.has(current)&&h('span',{style:{color:'var(--warn)',fontSize:13}},h(Icon,{name:'flag',size:13,color:'var(--warn)'})),
        h('span',{className:'q-source'},q.source||'')
      ),
      h('p',{className:'q-text'},q.q),
      h('div',{className:'options'},
        (q.opts||[]).map((opt,i)=>{
          let cls='option';
          if(isRevealed){
            if(i===q.answer)cls+=' correct';
            else if(answers[current]===i)cls+=' wrong';
          } else if(answers[current]===i)cls+=' selected';
          return h('button',{key:i,className:cls,onClick:()=>select(i)},
            h('span',{className:'option-letter'},LETTERS[i]),
            h('span',{className:'option-text'},opt)
          );
        })
      ),
      isRevealed&&q.explanation&&h('div',{className:'explanation-panel'},
        h('h4',null,'Explanation'),
        h('div',{className:'explanation-text'},q.explanation)
      )
    ),
    // Nav buttons
    h('div',{style:{display:'flex',gap:10,flexWrap:'wrap',marginBottom:12}},
      !isRevealed&&h('button',{className:'btn btn-secondary',onClick:skip},'⏭ Skip'),
      h('button',{className:`btn ${flagged.has(current)?'btn-secondary':'btn-secondary'}`,onClick:()=>setFlagged(f=>{const n=new Set(f);n.has(current)?n.delete(current):n.add(current);return n;})},
        h(Icon,{name:'flag',size:14,color:flagged.has(current)?'var(--warn)':'currentColor'}),flagged.has(current)?' Unflag':' Flag'
      ),
      h('div',{style:{flex:1}}),
      current>0&&h('button',{className:'btn btn-secondary',onClick:()=>setCurrent(c=>c-1)},h(Icon,{name:'prev',size:15}),' Prev'),
      current<questions.length-1
        ?h('button',{className:'btn btn-primary',onClick:()=>setCurrent(c=>c+1)},'Next ',h(Icon,{name:'next',size:15}))
        :h('button',{className:'btn btn-success',onClick:finish},h(Icon,{name:'award',size:15}),' Finish'),
      h('button',{className:'btn btn-secondary',onClick:()=>setShowTutor(t=>!t)},h(Icon,{name:'bot',size:15}),showTutor?' Hide Tutor':' AI Tutor'),
      h('button',{className:'btn btn-secondary btn-sm',onClick:()=>setShowNav(n=>!n)},'Q Nav')
    ),
    showNav&&h('div',{className:'q-jump'},questions.map((_,i)=>h('button',{key:i,className:dotClass(i),onClick:()=>{setCurrent(i);setShowNav(false);}},i+1))),
    showTutor&&isRevealed&&h(TutorPanel,{context:tutorContext,onOpenSettings:()=>setOpenSettings(true)}),
    !isRevealed&&showTutor&&h('div',{className:'alert alert-info',style:{marginTop:8}},h(Icon,{name:'info',size:16}),' Answer the question first to activate AI Tutor.')
  );
};

// ─── Results Screen ───────────────────────────────────────────────────────────
const ResultsScreen=({questions,answers,bankName,onReview,onRetry,onHome})=>{
  const total=questions.length;
  const answered=Object.keys(answers).filter(i=>answers[i]!==-1).length;
  const correct=questions.filter((_,i)=>answers[i]===questions[i].answer).length;
  const wrong=questions.filter((_,i)=>answers[i]!==undefined&&answers[i]!==-1&&answers[i]!==questions[i].answer).length;
  const skipped=questions.filter((_,i)=>answers[i]===-1).length;
  const unanswered=questions.filter((_,i)=>answers[i]===undefined).length;
  const pct=total>0?Math.round((correct/total)*100):0;

  const grade=pct>=75?'PASS':pct>=65?'BORDERLINE':'FAIL';
  const gradeColor=pct>=75?'var(--correct)':pct>=65?'var(--warn)':'var(--wrong)';

  return h('div',null,
    h('div',{className:'results-hero'},
      h('div',{style:{fontSize:13,color:'var(--text3)',marginBottom:8,textTransform:'uppercase',letterSpacing:'.5px'}},bankName),
      h('div',{className:'results-score',style:{color:gradeColor}},`${pct}%`),
      h('div',{className:'results-grade',style:{color:gradeColor}},grade),
      h('div',{className:'results-label'},`${correct} correct out of ${total} questions`),
      h('div',{className:'results-grid'},
        h('div',{className:'results-stat'},
          h('div',{className:'results-stat-num',style:{color:'var(--correct)'}},correct),
          h('div',{className:'results-stat-label'},'Correct')
        ),
        h('div',{className:'results-stat'},
          h('div',{className:'results-stat-num',style:{color:'var(--wrong)'}},wrong),
          h('div',{className:'results-stat-label'},'Wrong')
        ),
        h('div',{className:'results-stat'},
          h('div',{className:'results-stat-num',style:{color:'var(--text2)'}},skipped+unanswered),
          h('div',{className:'results-stat-label'},'Skipped')
        )
      )
    ),
    h('div',{className:'btn-group',style:{justifyContent:'center',flexWrap:'wrap'}},
      h('button',{className:'btn btn-primary',onClick:()=>onReview('all')},h(Icon,{name:'search',size:15}),' Review All'),
      h('button',{className:'btn btn-secondary',onClick:()=>onReview('wrong')},h(Icon,{name:'close',size:14}),' Wrong Only'),
      h('button',{className:'btn btn-secondary',onClick:()=>onReview('correct')},h(Icon,{name:'check',size:14}),' Correct Only'),
      h('button',{className:'btn btn-secondary',onClick:()=>onReview('skip')},'⏭ Skipped'),
      h('button',{className:'btn btn-secondary',onClick:onRetry},'🔁 Retry'),
      h('button',{className:'btn btn-secondary',onClick:onHome},h(Icon,{name:'home',size:14}),' Home')
    )
  );
};

// ─── Review Screen ────────────────────────────────────────────────────────────
const ReviewScreen=({questions,answers,initialFilter,onBack})=>{
  const [filter,setFilter]=useState(initialFilter||'all');
  const [expanded,setExpanded]=useState({});
  const [openSettings,setOpenSettings]=useState(false);

  const filtered=useMemo(()=>questions.map((q,i)=>({q,i,ans:answers[i]})).filter(({q,i,ans})=>{
    if(filter==='all')return true;
    if(filter==='correct')return ans===q.answer;
    if(filter==='wrong')return ans!==undefined&&ans!==-1&&ans!==q.answer;
    if(filter==='skip')return ans===-1||ans===undefined;
    return true;
  }),[questions,answers,filter]);

  const counts={
    all:questions.length,
    correct:questions.filter((q,i)=>answers[i]===q.answer).length,
    wrong:questions.filter((q,i)=>answers[i]!==undefined&&answers[i]!==-1&&answers[i]!==q.answer).length,
    skip:questions.filter((q,i)=>answers[i]===-1||answers[i]===undefined).length
  };

  return h('div',null,
    openSettings&&h(SettingsModal,{onClose:()=>setOpenSettings(false)}),
    h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:16}},
      h('button',{className:'btn-icon',onClick:onBack},h(Icon,{name:'prev',size:18})),
      h('h2',{style:{fontFamily:'var(--serif)',fontSize:22,flex:1}},'Review'),
      h('button',{className:'btn-icon',onClick:()=>setOpenSettings(true)},h(Icon,{name:'settings',size:16}))
    ),
    h('div',{className:'review-filters'},
      [['all','All',counts.all],['correct','✓ Correct',counts.correct],['wrong','✗ Wrong',counts.wrong],['skip','⏭ Skipped',counts.skip]].map(([v,l,c])=>
        h('button',{key:v,className:`filter-btn ${filter===v?'active':''}`,onClick:()=>setFilter(v)},`${l} (${c})`)
      )
    ),
    filtered.length===0
      ?h('div',{className:'empty'},h('div',{className:'empty-icon'},'🎉'),h('div',{className:'empty-title'},'Nothing here!'))
      :filtered.map(({q,i,ans})=>{
        const isCorrect=ans===q.answer;
        const isSkip=ans===-1||ans===undefined;
        const cls=`review-item ${isSkip?'skip':isCorrect?'correct':'wrong'}`;
        const isOpen=expanded[i];
        const tutorContext=`Question: ${q.q}\nOptions: ${(q.opts||[]).map((o,j)=>`${LETTERS[j]}. ${o}`).join('\n')}\nCorrect: ${LETTERS[q.answer]}. ${(q.opts||[])[q.answer]}\nExplanation: ${q.explanation||''}`;
        return h('div',{key:i,className:cls},
          h('div',{className:'q-meta',style:{marginBottom:8}},
            h('span',{className:'q-num'},`Q${i+1}`),
            q.exam&&h('span',{className:`badge badge-${(q.exam||'').toLowerCase()==='fop'?'fop':'tas'}`},q.exam),
            q.topic&&h('span',{className:'tag'},q.topic)
          ),
          h('div',{className:'review-q'},q.q),
          h('div',{className:'review-ans your'},`Your answer: ${ans===undefined||ans===-1?'Skipped':`${LETTERS[ans]}. ${(q.opts||[])[ans]}`}`),
          h('div',{className:'review-ans correct-ans'},`Correct: ${LETTERS[q.answer]}. ${(q.opts||[])[q.answer]}`),
          q.explanation&&h('div',null,
            h('button',{style:{background:'none',border:'none',color:'var(--accent)',fontSize:13,cursor:'pointer',padding:'6px 0'},onClick:()=>setExpanded(e=>({...e,[i]:!e[i]}))},
              isOpen?'▼ Hide explanation':'▶ Show explanation'
            ),
            isOpen&&h(Fragment,null,
              h('div',{className:'review-exp'},q.explanation),
              h(TutorPanel,{context:tutorContext,onOpenSettings:()=>setOpenSettings(true)})
            )
          )
        );
      })
  );
};

// ─── App Root ──────────────────────────────────────────────────────────────────
const App=()=>{
  const [banks,setBanks]=useState(loadBanks);
  const [screen,setScreen]=useState('home');
  const [activeBank,setActiveBank]=useState(null);
  const [quizQuestions,setQuizQuestions]=useState([]);
  const [quizAnswers,setQuizAnswers]=useState({});
  const [reviewFilter,setReviewFilter]=useState('all');
  const [showSettings,setShowSettings]=useState(false);
  const [showImportMain,setShowImportMain]=useState(false);

  const handleImport=(bank)=>{
    const updated={...banks,[bank.name]:{...bank,imported:new Date().toISOString()}};
    setBanks(updated);saveBanks(updated);
  };

  const handleDelete=(name)=>{
    const updated={...banks};delete updated[name];
    setBanks(updated);saveBanks(updated);
  };

  const handleExport=(name)=>{
    const bank=banks[name];if(!bank)return;
    const blob=new Blob([JSON.stringify(bank,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`${name.replace(/\s+/g,'_')}_qbank.json`;a.click();
  };

  const handleStartConfig=(name)=>{setActiveBank(name);setScreen('config');};

  const handleStartQuiz=(qs)=>{
    setQuizQuestions(qs);setQuizAnswers({});setScreen('quiz');
  };

  const handleFinish=(ans,qs)=>{setQuizAnswers(ans);setScreen('results');};

  const handleReview=(filter)=>{setReviewFilter(filter);setScreen('review');};

  const topTabs=[
    {id:'home',icon:'home',label:'Home'},
    {id:'import',icon:'import',label:'Import'},
  ];

  return h('div',{className:'app'},
    showSettings&&h(SettingsModal,{onClose:()=>setShowSettings(false)}),
    showImportMain&&h(ImportModal,{onClose:()=>setShowImportMain(false),onImport:handleImport}),
    // Topbar
    h('div',{className:'topbar'},
      h('div',{className:'topbar-logo'},'MRCPCH',h('span',null,'Quiz Engine')),
      screen!=='home'&&screen!=='config'&&h('button',{className:'topbar-btn',onClick:()=>setScreen('home')},h(Icon,{name:'home',size:15}),' Home'),
      h('button',{className:'topbar-btn',onClick:()=>setShowImportMain(true)},h(Icon,{name:'import',size:15}),' Import'),
      h('button',{className:'topbar-btn',onClick:()=>setShowSettings(true)},h(Icon,{name:'settings',size:15}),' Settings')
    ),
    // Main
    h('div',{className:'main'},
      screen==='home'&&h(HomeScreen,{
        banks,
        onStart:handleStartConfig,
        onDelete:handleDelete,
        onExport:handleExport,
        onImport:handleImport
      }),
      screen==='config'&&activeBank&&h(SessionConfig,{
        bank:banks[activeBank],
        bankName:activeBank,
        onStart:handleStartQuiz,
        onBack:()=>setScreen('home')
      }),
      screen==='quiz'&&h(QuizScreen,{
        questions:quizQuestions,
        onFinish:handleFinish,
        onBack:()=>setScreen('home')
      }),
      screen==='results'&&h(ResultsScreen,{
        questions:quizQuestions,
        answers:quizAnswers,
        bankName:activeBank||'',
        onReview:handleReview,
        onRetry:()=>{setQuizAnswers({});setScreen('quiz');},
        onHome:()=>setScreen('home')
      }),
      screen==='review'&&h(ReviewScreen,{
        questions:quizQuestions,
        answers:quizAnswers,
        initialFilter:reviewFilter,
        onBack:()=>setScreen('results')
      })
    )
  );
};

// ─── Mount ─────────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(h(App));

// ─── Service Worker ────────────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  const sw=`
const CACHE='mrcpch-v2';
const URLS=['./', './index.html',
  'https://unpkg.com/react@18/umd/react.production.min.js',
  'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
  'https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300&display=swap'
];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(URLS).catch(()=>{})));self.skipWaiting();});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim();});
self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res.ok){const c=res.clone();caches.open(CACHE).then(ca=>ca.put(e.request,c));}return res;}).catch(()=>caches.match('./index.html'))));});
`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
